apiVersion: v1
kind: Namespace
metadata:
  name: aws-simulation
---
apiVersion: v1
kind: Namespace
metadata:
  name: gcp-simulation
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: aws-simulation
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: aws-simulation
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: hashicorp/http-echo:1.0
      args:
        - "-text=ShopSphere AWS Backend is running"
      ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: aws-simulation
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: aws-simulation
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: gcp-simulation
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: gcp-simulation
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: hashicorp/http-echo:1.0
      args:
        - "-text=ShopSphere GCP Backend is running"
      ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: gcp-simulation
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: gcp-simulation
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 5678
      