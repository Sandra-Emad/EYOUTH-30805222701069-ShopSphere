name: ShopSphere CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shopsphere-production
  cancel-in-progress: true

jobs:
  development:
    name: Development - Install and Build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

  staging:
    name: Staging - Install, Migrate, Test and Build
    needs: development
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            review-service/package-lock.json
            serverless-function/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
        run: npm install

      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
        run: npx prisma migrate deploy

      - name: Test backend
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
          MONGO_URI: mongodb://127.0.0.1:27017/ecommerce_db1
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_db1
        run: npm test -- --runInBand

      - name: Install review service dependencies
        working-directory: review-service
        run: npm install

      - name: Install serverless function dependencies
        working-directory: serverless-function
        run: npm install

  production:
    name: Production - Verify
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify production frontend
        run: |
          curl --fail --silent --show-error \
            https://eyouth-30805222701069-shop-sphere-f.vercel.app \
            > /dev/null

      - name: Verify production backend health
        run: |
          curl --fail --silent --show-error \
            https://eyouth-30805222701069-shop-sphere.vercel.app/api/health

      - name: Verify production review service
        run: |
          curl --fail --silent --show-error \
            https://eyouth-30805222701069-shopsphere-re.vercel.app/api/health

      - name: Verify production serverless function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://shopsphere-low-stock-function.vercel.app/api/low-stock-report
          else
            curl --fail --silent --show-error \
              https://shopsphere-low-stock-function.vercel.app/api/low-stock-report
          fi
