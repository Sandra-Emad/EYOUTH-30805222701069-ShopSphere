name: ShopSphere Production CI/CD - Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shopsphere-production
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test and build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            review-service/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          MONGO_URI: ${{ secrets.TEST_MONGODB_URI }}
        run: npm test -- --runInBand

      - name: Install review-service dependencies
        working-directory: review-service
        run: npm ci

      - name: Install serverless-function dependencies
        working-directory: serverless-function
        run: npm install

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy frontend
        working-directory: frontend
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --project "${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}"

      - name: Deploy backend
        working-directory: backend
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --project "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}"

      - name: Deploy review service
        working-directory: review-service
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --project "${{ secrets.VERCEL_REVIEW_PROJECT_ID }}"

      - name: Deploy serverless function
        working-directory: serverless-function
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --project "${{ secrets.VERCEL_SERVERLESS_PROJECT_ID }}"
