name: ShopSphere CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shopsphere-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: Development - Install and Build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

  staging:
    name: Staging - Install, Migrate, Test and Build
    needs: development
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            review-service/package-lock.json
            serverless-function/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
        run: npm install

      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
        run: npx prisma migrate deploy

      - name: Test backend
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test_db
          MONGO_URI: mongodb://127.0.0.1:27017/ecommerce_db1
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_db1
        run: npm test -- --runInBand

      - name: Install review-service dependencies
        working-directory: review-service
        run: npm install

      - name: Install serverless-function dependencies
        working-directory: serverless-function
        run: npm install

  production:
    name: Production - Validate Existing Deployments
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production frontend
        env:
          FRONTEND_URL: https://eyouth-30805222701069-shop-sphere-f.vercel.app
        run: |
          set -e
          echo "Checking production frontend..."
          status=$(curl -L -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          echo "Frontend HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Production frontend validation failed."
            exit 1
          fi

      - name: Validate production backend health
        env:
          BACKEND_HEALTH_URL: https://eyouth-30805222701069-shop-sphere.vercel.app/api/health
        run: |
          set -e
          echo "Checking production backend health..."
          status=$(curl -L -s -o /dev/null -w "%{http_code}" "$BACKEND_HEALTH_URL")
          echo "Backend health HTTP status: $status"

          if [ "$status" -ne 200 ]; then
            echo "Production backend health check failed."
            exit 1
          fi

      - name: Validate production review service
        env:
          REVIEW_HEALTH_URL: https://eyouth-30805222701069-shopsphere-re.vercel.app/api/health
        run: |
          set -e
          echo "Checking production review service..."
          status=$(curl -L -s -o /dev/null -w "%{http_code}" "$REVIEW_HEALTH_URL")
          echo "Review service HTTP status: $status"

          if [ "$status" -ne 200 ]; then
            echo "Production review service validation failed."
            exit 1
          fi

      - name: Validate production serverless function endpoint
        env:
          SERVERLESS_URL: https://shopsphere-low-stock-function.vercel.app/api/low-stock-report
        run: |
          set -e
          echo "Checking production serverless function endpoint..."
          status=$(curl -L -s -o /dev/null -w "%{http_code}" "$SERVERLESS_URL")
          echo "Serverless endpoint HTTP status: $status"

          if [ "$status" -ne 200 ] && [ "$status" -ne 401 ] && [ "$status" -ne 403 ]; then
            echo "Production serverless endpoint is not reachable."
            exit 1
          fi

          echo "Serverless endpoint is reachable."
          echo "401/403 are accepted here because the endpoint may require CRON_SECRET authorization."

      - name: Production validation summary
        run: |
          echo "Production validation completed successfully."
          echo "Existing Task 1 production deployments are reachable."
          echo "Frontend: https://eyouth-30805222701069-shop-sphere-f.vercel.app"
          echo "Backend: https://eyouth-30805222701069-shop-sphere.vercel.app/api/health"
          echo "Review Service: https://eyouth-30805222701069-shopsphere-re.vercel.app/api/health"
          echo "Serverless: https://shopsphere-low-stock-function.vercel.app/api/low-stock-report"
          echo "New Vercel deployments are intentionally not created by this validation job."
